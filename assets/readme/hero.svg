<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Codex 话题实时命名，更好区分</title>
  <desc id="desc">三个话题标题的合成示例：你好变成带工具 emoji 的邮箱验证码过期排查，帮我看一下变成带场记板 emoji 的图像模型对比视频策划，继续修改变成带调色板 emoji 的登录表单布局优化。每轮对话结束后由独立 Luna Fast 判断。</desc>
  <rect width="1200" height="760" rx="28" fill="#F4F3ED"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
    <text x="56" y="66" font-size="24" font-weight="600" fill="#62766A">oil-codex-title</text>
    <g transform="translate(932 36)">
      <rect width="212" height="42" rx="21" fill="#E2EAE1"/>
      <circle cx="23" cy="21" r="5" fill="#397256"/>
      <text x="40" y="28" font-size="19" fill="#355D46">独立 Luna Fast</text>
    </g>
    <text x="52" y="157" font-size="62" font-weight="700" letter-spacing="-2" fill="#193A2B">Codex 话题实时命名</text>
    <text x="52" y="242" font-size="76" font-weight="750" letter-spacing="-2" fill="#397B51">更好区分。</text>
    <text x="58" y="290" font-size="25" fill="#62766A">话题聊到哪，标题跟到哪。emoji 分类，具体目标一眼可见。</text>

    <g id="before" transform="translate(48 344)">
      <rect width="370" height="306" rx="20" fill="#EAEAE3"/>
      <text x="28" y="44" font-size="22" font-weight="600" fill="#778177">原来的标题</text>
      <path d="M28 63h314" stroke="#D1D7CD"/>
      <g fill="#7B857B" font-size="34">
        <text x="30" y="117">你好</text>
        <text x="30" y="193">帮我看一下</text>
        <text x="30" y="269">继续修改</text>
      </g>
      <g stroke="#BEC8BC" stroke-width="2.5" stroke-linecap="round">
        <path d="M305 104h34m-34 8h22"/>
        <path d="M305 180h34m-34 8h22"/>
        <path d="M305 256h34m-34 8h22"/>
      </g>
    </g>

    <g id="rename-arrows" fill="none" stroke="#76A287" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M437 450h43m-11-10 11 10-11 10"/>
      <path d="M437 526h43m-11-10 11 10-11 10"/>
      <path d="M437 602h43m-11-10 11 10-11 10"/>
    </g>

    <g id="after" transform="translate(500 344)">
      <rect width="652" height="306" rx="20" fill="#FFFFFF"/>
      <text x="28" y="44" font-size="22" font-weight="600" fill="#397B51">现在，一眼认出正在做什么</text>
      <path d="M28 63h596" stroke="#E3EAE1"/>
      <rect x="16" y="78" width="620" height="60" rx="12" fill="#E8F1E7"/>
      <rect x="16" y="154" width="620" height="60" rx="12" fill="#EFF2FA"/>
      <rect x="16" y="230" width="620" height="60" rx="12" fill="#F6EEF4"/>
      <g font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" font-size="36">
        <text x="30" y="120">🛠️</text>
        <text x="30" y="196">🎬</text>
        <text x="30" y="272">🎨</text>
      </g>
      <g fill="#233D2F" font-size="34" font-weight="550">
        <text x="88" y="119">邮箱验证码过期排查</text>
        <text x="88" y="195">图像模型对比视频策划</text>
        <text x="88" y="271">登录表单布局优化</text>
      </g>
    </g>
    <text x="56" y="710" font-size="23" fill="#62766A">每轮结束后自动判断</text>
    <circle cx="326" cy="703" r="3" fill="#9CAE9F"/>
    <text x="348" y="710" font-size="23" fill="#62766A">参考最近 3～5 轮对话</text>
    <circle cx="641" cy="703" r="3" fill="#9CAE9F"/>
    <text x="663" y="710" font-size="23" fill="#62766A">命名消息不进入原对话</text>
  </g>
</svg>
